name: Phase 12 console finalizer

on:
  push:
    branches:
      - agent/phase-12-platform-ops
    paths:
      - .github/workflows/phase12-console-finalizer.yml
      - scripts/finalize-platform-console.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-platform-ops
          fetch-depth: 0

      - name: Apply reviewed console hardening
        run: node scripts/finalize-platform-console.mjs

      - name: Verify generated source
        run: |
          git diff --check
          grep -F "Read-only platform access" apps/web/src/modules/platform/PlatformControlCenter.js
          grep -F "Release legal hold" apps/web/src/modules/platform/PlatformControlCenter.js
          grep -F "Suspend before offboarding" apps/web/src/modules/platform/PlatformControlCenter.js
          if grep -F "storageGb" apps/web/src/modules/platform/PlatformControlCenter.js; then
            echo "Unenforced storage quota remains in the console" >&2
            exit 1
          fi

      - name: Commit generated console and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/platform/PlatformControlCenter.js
          git rm .github/workflows/phase12-console-finalizer.yml scripts/finalize-platform-console.mjs
          git diff --cached --check
          git commit -m "fix(platform): complete role-aware admin console workflows"
          git push origin HEAD:agent/phase-12-platform-ops
