name: hippo_mobile
description: Construction ERP Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.2
  # Network
  dio: ^5.7.0
  # Secure storage
  flutter_secure_storage: ^9.2.2
  # Local database
  drift: ^2.22.0
  # Offline sync
  connectivity_plus: ^6.1.1
  # Push notifications
  firebase_messaging: ^15.1.6
  # Image picker
  image_picker: ^1.1.2
  # Location
  geolocator: ^13.0.1
  # Form validation
  form_builder_validators: ^11.0.0
  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.2
  drift_dev: ^2.22.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
